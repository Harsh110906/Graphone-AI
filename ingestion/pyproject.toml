[project]
name = "graphone-ingestion"
version = "0.1.0"
description = "GraphOne AI Intelligence Search — Ingestion & Verification Engine"
requires-python = ">=3.11"
dependencies = [
    # Schema validation
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    # Async HTTP
    "httpx>=0.27",
    "aiohttp>=3.9",
    # HTML parsing & extraction
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "readability-lxml>=0.8",
    # RSS/Atom
    "feedparser>=6.0",
    # Fuzzy matching
    "rapidfuzz>=3.0",
    # Database
    "psycopg[binary,pool]>=3.1",
    "pgvector>=0.3",
    # Redis
    "redis[hiredis]>=5.0",
    # Google Sheets export
    "gspread>=6.0",
    "google-auth>=2.0",
    # Logging & observability
    "structlog>=24.0",
    "sentry-sdk>=2.0",
    # Env loading
    "python-dotenv>=1.0",
    # Token counting
    "tiktoken>=0.7",
    # Retry/backoff
    "tenacity>=8.0",
    # Browser automation (selective)
    "playwright>=1.40",
    # Unicode normalization
    "Unidecode>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true

version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: graphone-postgres
    environment:
      POSTGRES_USER: graphone
      POSTGRES_PASSWORD: graphone
      POSTGRES_DB: graphone
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphone"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: graphone-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
